services:
    jekyll:
        build:
            context: .
            secrets:
                - ca
        image: conan-blog
        ports:
            - 4000:4000
        volumes:
            - .:/srv/jekyll

secrets:
    ca:
        # Root CA of a TLS-inspecting proxy, only needed to install the gems
        # behind one: CA_CERT=/path/to/root-ca.crt docker compose up --build
        file: ${CA_CERT:-/dev/null}
